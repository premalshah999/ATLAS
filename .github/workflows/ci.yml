name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.19.0, cache: pnpm }
      - name: OS sandbox and desktop tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap xdotool x11-utils imagemagick
          # Ubuntu 24.04 restricts unprivileged user namespaces; bubblewrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: pnpm install --frozen-lockfile
      - run: pnpm doctor
      - run: pnpm pi:version
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - name: Electron e2e
        run: xvfb-run -a pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-results, path: test-results/ }
